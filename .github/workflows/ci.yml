name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      source_ref:
        description: "Exact commit, branch, or tag to validate"
        required: false
        type: string
        default: ""
      build_release_artifact:
        description: "Archive the built frontend for the release workflow"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "22.18.0"
  PNPM_VERSION: "10.33.0"

jobs:
  repository:
    name: Repository and documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Check product version
        run: python3 scripts/check_release_version.py

      - name: Compile Python sources
        run: python3 -m compileall -q config fuwu_service release_api manage.py scripts

      - name: Check documentation structure
        shell: bash
        run: |
          set -euo pipefail
          files=(README.md PROJECT_LEDGER.md docs/API.md docs/DEPLOYMENT.md docs/PUBLISH_CONSISTENCY.md docs/VERSION_HISTORY.md docs/releases/*.md)
          for file in "${files[@]}"; do
            test -f "$file" || { echo "Missing documentation: $file" >&2; exit 1; }
            grep -q '^# ' "$file" || { echo "Missing H1 heading: $file" >&2; exit 1; }
            fences=$(grep -c '^```' "$file" || true)
            test "$((fences % 2))" -eq 0 || { echo "Unclosed code fence: $file" >&2; exit 1; }
          done

      - name: Check whitespace
        run: git diff --check

  backend:
    name: Backend tests and Django checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install locked dependencies
        run: uv sync --frozen --all-extras

      - name: Run Django checks
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
          uv run python manage.py migrate --plan

      - name: Run backend tests
        run: uv run pytest -q

  proxy:
    name: Proxy and download contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Exercise isolated proxy chain
        run: python3 scripts/check_deployment.py

  frontend:
    name: Frontend tests, typecheck, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run Fuwu frontend tests
        working-directory: frontend
        run: pnpm test:fuwu

      - name: Typecheck web-antd
        working-directory: frontend
        run: pnpm --filter @vben/web-antd typecheck

      - name: Build web-antd
        working-directory: frontend
        run: pnpm --filter @vben/web-antd build

      - name: Archive frontend build for CD
        if: inputs.build_release_artifact
        working-directory: frontend
        run: |
          set -euo pipefail
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf frontend-dist.tar.gz -C apps/web-antd dist
          sha256sum frontend-dist.tar.gz > frontend-dist.sha256
          git -C .. rev-parse HEAD > frontend-dist.source

      - name: Upload frontend build for CD
        if: inputs.build_release_artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuwu-frontend-dist
          path: |
            frontend/frontend-dist.tar.gz
            frontend/frontend-dist.sha256
            frontend/frontend-dist.source
          if-no-files-found: error
          retention-days: 1
