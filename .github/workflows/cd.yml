name: CD

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to package and validate"
        required: true
        default: "main"
      publish:
        description: "Create a GitHub Release after validation"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Reuse CI checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  package:
    name: Package source
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Validate version ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
            [[ "$tag" =~ ^v[0-9]\.[0-9]\.[0-9]$ ]] || { echo "Tag must use v plus one-digit numeric components (for example v0.0.1): $tag" >&2; exit 1; }
          else
            echo "Manual CD run for ref: ${{ inputs.ref }}"
          fi

      - name: Build source archive and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="dist/fuwu-${GITHUB_SHA}.tar.gz"
          git archive --format=tar.gz --output="$archive" HEAD
          (cd dist && sha256sum "$(basename "$archive")" > SHA256SUMS)

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuwu-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="dist/fuwu-${GITHUB_SHA}.tar.gz"
          git archive --format=tar.gz --output="$archive" HEAD
          (cd dist && sha256sum "$(basename "$archive")" > SHA256SUMS)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_ref="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_ref="manual-${GITHUB_SHA:0:12}"
          fi
          gh release create "$release_ref" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$release_ref" \
            --generate-notes
