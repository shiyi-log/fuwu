[project]
name = "fuwu"
version = "0.0.7"
description = "通用发行管理服务"
requires-python = ">=3.14"
dependencies = [
  "Django>=5.2,<6.1",
  "djangorestframework>=3.15,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-django>=4.9"]

[project.scripts]
fuwu-server = "fuwu_service.server:serve"

[tool.uv]
package = true

[tool.setuptools]
packages = ["config", "release_api", "fuwu_service"]

[tool.setuptools.package-data]
fuwu_service = ["*.sh"]

[tool.pytest.ini_options]
pythonpath = ["."]
