# Only explicitly configured network peers may supply the original TLS scheme.
# The image entrypoint generates this include from FUWU_TRUSTED_PROXY_CIDRS.
geo $fuwu_trusted_proxy {
  default 0;
  include /etc/nginx/fuwu-trusted-proxies.conf;
}
map $http_x_forwarded_proto $fuwu_requested_proto {
  default "";
  ~*^https$ https;
  ~*^http$ http;
}
map "$fuwu_trusted_proxy:$fuwu_requested_proto" $fuwu_forwarded_proto {
  default $scheme;
  "1:https" https;
  "1:http" http;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  proxy_http_version 1.1;
  # Keep this above the frontend's 15-minute staging/sync timeout.
  proxy_read_timeout 1200s;
  proxy_send_timeout 1200s;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $fuwu_forwarded_proto;

  location /api/ {
    proxy_pass http://api:8000;
    # Public downloads are streamed, without temporary proxy files or cache.
    proxy_buffering off;
  }

  location /releases/ {
    proxy_pass http://api:8000;
    proxy_buffering off;
  }

  location /healthz {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
